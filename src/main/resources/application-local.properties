spring.application.name=Athenix-Back

# Server
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# H2 Database (Local Development)
spring.datasource.url=${DB_URL:jdbc:h2:mem:athenix;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${JPA_USE_SQL_COMMENTS:true}
spring.jpa.defer-datasource-initialization=true

# SQL 초기화
spring.sql.init.mode=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# FFmpeg
app.ffmpeg.path=${FFMPEG_PATH:/opt/homebrew/bin/ffmpeg}

# File Upload
app.storage.path=${STORAGE_PATH:${user.dir}/uploads}
app.storage.max-file-size=${STORAGE_MAX_FILE_SIZE:1073741824}

# Multipart Upload Size
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:1GB}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.community.athenixback=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_BINDER:TRACE}