spring.application.name=Athenix-Back

# Server
server.servlet.context-path=/api/v1

# H2 Database (Local Development)
spring.datasource.url=jdbc:h2:mem:athenix;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# SQL ??? ???
spring.sql.init.mode=always

# JWT
jwt.secret=aHR0cHM6Ly9hdGhlbml4LWJhY2suY29tL2p3dC9zZWNyZXQta2V5LXlvdXItc3VwZXItc3RyaWN0LWxvbmctand0LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LWp3dC1zcGVjaWZpY2F0aW9u
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# File Upload
app.storage.path=${user.dir}/uploads
app.storage.max-file-size=1073741824

# Multipart Upload Size
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# Logging
logging.level.root=INFO
logging.level.com.community.athenixback=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
