spring.application.name=Athenix-Back

# Server
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# MySQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# FFmpeg
app.ffmpeg.path=${FFMPEG_PATH:ffmpeg}

# File Upload
app.storage.path=${STORAGE_PATH:${user.dir}/uploads}
app.storage.max-file-size=${STORAGE_MAX_FILE_SIZE:1073741824}

# Multipart Upload Size
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10GB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10GB}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.community.athenixback=${LOG_LEVEL_APP:INFO}

# AI Server
ai.server.url=${AI_SERVER_URL}
ai.server.endpoint.recommend=${AI_ENDPOINT_RECOMMEND:/ai/recommend/image}
